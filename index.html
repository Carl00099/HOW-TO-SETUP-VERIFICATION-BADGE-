<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>JAWAD-MD | Mini BOT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    /* ... (Keep your original CSS here) ... */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #0a0a0f; color: white; min-height: 100vh; overflow-x: hidden; }
    .container { position: relative; z-index: 10; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 480px; background: rgba(20, 20, 30, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 40px 30px; box-shadow: 0 20px 80px rgba(0,0,0,0.5); }
    .title { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
    .input { width: 100%; padding: 16px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 16px; color: white; margin-top: 10px; }
    .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 600; cursor: pointer; margin-top: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .code-box { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 16px; margin-top: 20px; text-align: center; font-family: monospace; font-size: 24px; color: #00d4aa; }
    #loading { display: none; text-align: center; margin-top: 10px; color: #667eea; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 class="title">JAWAD-MD</h1>
      <p style="text-align: center; opacity: 0.6;">Pairing Code Generator</p>
      
      <form id="pairForm">
        <input type="tel" id="phoneNumber" class="input" placeholder="e.g. 92342758xxxx" required>
        <button type="submit" class="btn" id="generateBtn">Generate Code</button>
      </form>

      <div id="loading">Connecting to WhatsApp...</div>
      <div id="codeBox" style="display:none;" class="code-box"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('pairForm');
    const phoneInput = document.getElementById('phoneNumber');
    const codeBox = document.getElementById('codeBox');
    const loading = document.getElementById('loading');

    form.onsubmit = async (e) => {
      e.preventDefault();
      loading.style.display = 'block';
      codeBox.style.display = 'none';
      
      try {
        // This calls the Vercel API we are about to create
        const res = await axios.get('/api', { params: { number: phoneInput.value } });
        codeBox.innerText = res.data.code;
        codeBox.style.display = 'block';
      } catch (err) {
        alert("Error: " + (err.response?.data?.error || "Failed"));
      } finally {
        loading.style.display = 'none';
      }
    };
  </script>
</body>
</html>
